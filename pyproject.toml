[project]
name = "zuzu"
version = "0.1.0"
description = "Voice-first assistant that fills USCIS immigration forms (MVP: I-765)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pypdf[crypto]>=5.1",
    "python-dotenv>=1.0",
    "websockets>=13.1",
]

[project.optional-dependencies]
# Layer 2: distributed session state, pub/sub, and the worker pool.
distributed = [
    "redis>=5.2",
    "arq>=0.26",
]
# Sponsor integrations, kept optional so Layer 1 runs with zero API keys.
integrations = [
    "mem0ai>=0.1.40",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
