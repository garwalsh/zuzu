<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zuzu — live form fill</title>
<style>
  :root{
    --bg:#070a10; --panel:rgba(20,26,36,.72); --line:rgba(255,255,255,.075);
    --ink:#e9eff7; --dim:#8794a6; --accent:#5aa2ff; --ok:#3fd77e; --mem:#b184ff;
    --shadow:0 8px 28px rgba(0,0,0,.42);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); background:var(--bg); overflow-x:hidden;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* Fallback gradient. Visible whenever WebGL is unavailable or blocked, so the
     page never renders as a flat black rectangle. */
  #bg-fallback{
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(1100px 700px at 12% -10%, #16305c 0%, transparent 60%),
      radial-gradient(900px 600px at 88% 8%, #3a1d5e 0%, transparent 55%),
      radial-gradient(1000px 800px at 50% 110%, #0d3b46 0%, transparent 60%),
      var(--bg);
  }
  #bg-canvas{position:fixed; inset:0; z-index:-1; display:block; opacity:0;
             transition:opacity 1.1s ease}
  #bg-canvas.on{opacity:1}

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:14px 24px; border-bottom:1px solid var(--line);
    background:rgba(9,13,20,.62); backdrop-filter:blur(18px) saturate(1.4);
  }
  h1{font-size:17px;margin:0;font-weight:680;letter-spacing:-.3px}
  h1 .sub{color:var(--dim);font-weight:400;margin-left:9px;font-size:12.5px;letter-spacing:0}
  .spacer{flex:1}
  button{
    background:linear-gradient(180deg,#5aa2ff,#3d7fdd); color:#fff; border:0;
    border-radius:9px; padding:9px 16px; font:inherit; font-size:13px; font-weight:600;
    cursor:pointer; box-shadow:0 3px 14px rgba(61,127,221,.35);
    transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s, filter .16s;
  }
  button:hover{transform:translateY(-1.5px);box-shadow:0 7px 22px rgba(61,127,221,.45)}
  button:active{transform:translateY(0)}
  button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
  button.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);
               box-shadow:none;color:var(--ink);backdrop-filter:blur(8px)}
  button.ghost:hover{background:rgba(255,255,255,.09)}

  .pill{
    font-size:11.5px; padding:5px 12px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--line); color:var(--dim); font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.035); backdrop-filter:blur(8px);
  }
  .pill b{color:var(--ink);font-weight:640}
  .pill.live{border-color:rgba(63,215,126,.5);color:var(--ok);
             box-shadow:0 0 16px rgba(63,215,126,.18)}
  .pill.mem{border-color:rgba(177,132,255,.5);color:var(--mem)}

  main{display:grid;grid-template-columns:1fr 375px;gap:20px;padding:20px 24px 40px;
       align-items:start;max-width:1600px;margin:0 auto}
  @media(max-width:1050px){main{grid-template-columns:1fr}}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; box-shadow:var(--shadow); backdrop-filter:blur(16px) saturate(1.25);
  }
  .card h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);
    margin:0;padding:13px 18px;border-bottom:1px solid var(--line);font-weight:650;
  }
  .grp{padding:4px 18px 16px}
  .grp h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
          margin:16px 0 9px;font-weight:650;opacity:.85}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
  .f{
    position:relative; border:1px solid var(--line); border-radius:11px;
    padding:9px 12px; background:rgba(255,255,255,.022); overflow:hidden;
    transition:border-color .4s ease, background .4s ease, transform .3s cubic-bezier(.2,.8,.3,1);
  }
  .f .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.55px;
        display:flex;justify-content:space-between;gap:6px;font-weight:600}
  .f .v{margin-top:4px;font-size:13.5px;min-height:20px;color:#3f4855;
        word-break:break-word;font-variant-numeric:tabular-nums}
  .f.set{border-color:rgba(63,215,126,.42);background:rgba(63,215,126,.055)}
  .f.set .v{color:var(--ink)}
  .f.frommem{border-color:rgba(177,132,255,.45);background:rgba(177,132,255,.06)}
  .f.skipped{border-color:var(--line);background:rgba(255,255,255,.015)}
  .f.skipped .v{color:var(--dim);font-style:italic;opacity:.75}
  /* Sweep of light across a field the instant its value lands. */
  .f.flash{animation:lift .75s cubic-bezier(.2,.8,.3,1)}
  .f.flash::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 30%,rgba(120,180,255,.32) 50%,transparent 70%);
    transform:translateX(-100%);animation:sweep .75s ease-out;
  }
  @keyframes sweep{to{transform:translateX(100%)}}
  @keyframes lift{
    0%{transform:scale(1)}
    35%{transform:scale(1.035);border-color:var(--accent)}
    100%{transform:scale(1)}
  }
  @media (prefers-reduced-motion:reduce){
    .f.flash,.f.flash::after{animation:none}
    button:hover{transform:none}
  }
  .tag{font-size:8.5px;padding:1.5px 5px;border-radius:4px;border:1px solid currentColor;
       opacity:.6;letter-spacing:.3px}

  #log{height:280px;overflow-y:auto;padding:10px 16px;font-size:12px;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #log div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);color:var(--dim);
           white-space:pre-wrap;word-break:break-word;animation:slidein .3s ease}
  @keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1}}
  #log b{color:var(--ink);font-weight:560}
  #widget{padding:14px 18px;min-height:60px}
  .muted{color:var(--dim);font-size:12.5px;padding:0 18px 15px;margin:0}
  a.dl{
    display:inline-block;margin:2px 18px 18px;padding:10px 17px;
    background:linear-gradient(180deg,#3fd77e,#28b464);color:#04170c;border-radius:9px;
    text-decoration:none;font-weight:700;font-size:13px;
    box-shadow:0 4px 18px rgba(63,215,126,.32);transition:transform .16s,box-shadow .16s;
  }
  a.dl:hover{transform:translateY(-1.5px);box-shadow:0 8px 26px rgba(63,215,126,.42)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="bg-fallback"></div>
<canvas id="bg-canvas"></canvas>

<header>
  <h1>Zuzu <span class="sub" id="formtitle">I-765</span></h1>
  <span class="pill" id="p-session">no session</span>
  <span class="pill" id="p-progress">0 / 0</span>
  <span class="pill" id="p-latency">— ms</span>
  <span class="pill mem" id="p-mem" style="display:none">returning caller</span>
  <span class="spacer"></span>
  <button id="demo">▶ Demo Mode</button>
  <button id="attach" class="ghost">Attach to live call</button>
</header>

<main>
  <section class="card">
    <h2>Form fields</h2>
    <div class="grp" id="grid"></div>
    <a class="dl" id="dl" style="display:none">Download completed PDF</a>
  </section>

  <div>
    <section class="card" style="margin-bottom:20px">
      <h2>Voice</h2>
      <div id="widget"></div>
      <p class="muted" id="widgethint">Loading voice agent…</p>
    </section>
    <section class="card">
      <h2>Activity</h2>
      <div id="log"></div>
    </section>
  </div>
</main>

<script type="module">
// ---------------------------------------------------------------------------
// Ambient WebGL background. Loaded from a CDN as an ES module so this page
// still needs no build step. Every failure path -- no WebGL, blocked CDN,
// offline conference wifi -- falls back to the CSS gradient underneath, so the
// dashboard is never worse than it was without it.
// ---------------------------------------------------------------------------
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function initBackground(){
  if (reduceMotion) return;
  const canvas = document.getElementById('bg-canvas');
  try{
    const THREE = await import('https://esm.sh/three@0.169.0');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // cheap on laptops
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // Slow-drifting colour field. Deliberately low-frequency: it should read as
    // atmosphere behind the data, never as something competing with it.
    const material = new THREE.ShaderMaterial({
      uniforms:{ t:{value:0}, res:{value:new THREE.Vector2(1,1)} },
      vertexShader:`void main(){ gl_Position = vec4(position, 1.0); }`,
      fragmentShader:`
        precision mediump float;
        uniform float t; uniform vec2 res;
        float blob(vec2 p, vec2 c, float r){ return r / (length(p - c) + 0.0001); }
        void main(){
          vec2 uv = gl_FragCoord.xy / res;
          vec2 p = (uv - 0.5) * vec2(res.x / res.y, 1.0);
          float a = blob(p, vec2(sin(t*0.11)*0.55 - 0.45, cos(t*0.09)*0.30 + 0.42), 0.085);
          float b = blob(p, vec2(cos(t*0.08)*0.50 + 0.52, sin(t*0.12)*0.26 + 0.30), 0.072);
          float c = blob(p, vec2(sin(t*0.07)*0.42, cos(t*0.10)*0.34 - 0.50), 0.078);
          vec3 col = vec3(0.055,0.078,0.125);
          col += vec3(0.10,0.26,0.62) * a * 0.30;
          col += vec3(0.36,0.16,0.62) * b * 0.26;
          col += vec3(0.05,0.42,0.42) * c * 0.24;
          // Vignette keeps the centre calm where the panels sit.
          col *= 1.0 - 0.32 * length(uv - 0.5);
          gl_FragColor = vec4(col, 1.0);
        }`
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

    const resize = () => {
      renderer.setSize(innerWidth, innerHeight, false);
      material.uniforms.res.value.set(innerWidth, innerHeight);
    };
    resize();
    addEventListener('resize', resize);

    let raf = null;
    const clock = new THREE.Clock();
    const loop = () => {
      material.uniforms.t.value += clock.getDelta();
      renderer.render(scene, camera);
      raf = requestAnimationFrame(loop);
    };
    loop();
    canvas.classList.add('on');

    // Stop burning GPU while the tab is hidden -- this runs for a whole demo.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){ cancelAnimationFrame(raf); raf = null; }
      else if (!raf){ clock.getDelta(); loop(); }
    });
  } catch (err){
    // CSS gradient stays. Nothing to do, and nothing to apologise for.
    console.info('ambient background unavailable, using gradient fallback:', err.message);
  }
}
initBackground();
</script>

<script>
const qs = new URLSearchParams(location.search);
// The secret stays in the URL the operator opens; it is never baked into the
// served HTML, so the page itself is not a credential.
const SECRET = qs.get('secret') || '';
const FORM = qs.get('form') || 'I-765';
const H = {'X-Zuzu-Secret': SECRET, 'Content-Type': 'application/json'};
const SKIP = '__skip__';

let schema = null, ws = null, sessionId = null, saves = [];

const el = id => document.getElementById(id);
const log = (msg, strong) => {
  const d = document.createElement('div');
  d.innerHTML = strong ? `<b>${msg}</b>` : msg;
  el('log').prepend(d);
};

async function loadSchema(){
  const r = await fetch(`/forms/${FORM}/schema`);
  schema = await r.json();
  el('formtitle').textContent = `${schema.form_id} — ${schema.title} (ed. ${schema.edition})`;

  const groups = {};
  schema.fields.forEach(f => (groups[f.group] ||= []).push(f));
  el('grid').innerHTML = Object.entries(groups).map(([g, fs]) => `
    <h3>${g.replace(/_/g,' ')}</h3>
    <div class="fields">${fs.map(f => `
      <div class="f" id="f-${f.id}">
        <div class="k"><span>${f.id.replace(/_/g,' ')}</span>${
          f.sensitive ? '<span class="tag">sensitive</span>' : ''}</div>
        <div class="v" id="v-${f.id}"></div>
      </div>`).join('')}</div>`).join('');
  el('p-progress').innerHTML = `<b>0</b> / ${schema.fields.length}`;
}

function paint(id, value, source){
  const box = el(`f-${id}`), v = el(`v-${id}`);
  if (!box) return;
  if (value === SKIP){
    // Asked, and the applicant had no answer. Showing a masked-looking value
    // here would imply we collected something we did not.
    v.textContent = 'not provided';
    box.classList.add('skipped');
    box.classList.remove('set','frommem');
    return;
  }
  v.textContent = value ?? '✓';
  box.classList.add('set','flash');
  if (source === 'memory') box.classList.add('frommem');
  setTimeout(() => box.classList.remove('flash'), 780);
}

async function hydrate(id){
  const r = await fetch(`/sessions/${id}/values`, {headers: H});
  if (!r.ok) return;
  const d = await r.json();
  Object.entries(d.values).forEach(([k, v]) => paint(k, v, d.sources[k]));
  el('p-progress').innerHTML = `<b>${d.known_count}</b> / ${schema.fields.length}`;
  if (d.is_returning) el('p-mem').style.display = '';
  if (d.has_pdf) showPdf(id);
}

function showPdf(id){
  const a = el('dl');
  a.href = `/forms/${id}.pdf`;
  a.style.display = 'inline-block';
}

function connect(id){
  if (ws) ws.close();
  sessionId = id;
  saves = [];
  el('p-session').textContent = id.slice(0, 26);
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/${id}?secret=${encodeURIComponent(SECRET)}`);
  ws.onopen  = () => { el('p-session').classList.add('live'); log('connected to ' + id, true); };
  ws.onclose = () => el('p-session').classList.remove('live');
  ws.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if (e.type === 'session_started'){
      if (e.data.is_returning){
        el('p-mem').style.display = '';
        log(`returning caller — ${e.data.prefilled_count} fields recalled from memory`, true);
      }
      hydrate(id);
    }
    if (e.type === 'field_saved'){
      // Server-measured time for the save path, not client round-trip: this is
      // the number the "voice path stays fast" claim rests on.
      if (typeof e.data.duration_ms === 'number'){
        saves.push(e.data.duration_ms);
        el('p-latency').innerHTML =
          `save <b>${e.data.duration_ms.toFixed(2)}</b> ms · max <b>${Math.max(...saves).toFixed(2)}</b>`;
      }
      paint(e.data.field_id, null, e.data.source);
      hydrate(id);
      log(`saved ${e.data.field_id}${e.data.sensitive ? ' (read-back confirmed)' : ''}`);
    }
    if (e.type === 'form_ready'){ showPdf(id); log('form ready — PDF generated', true); }
    if (e.type === 'session_completed') log('call ended', true);
  };
}

el('demo').onclick = async () => {
  el('demo').disabled = true;
  el('demo').textContent = 'running…';
  log('starting Demo Mode (no microphone needed)', true);
  try{
    const r = await fetch('/demo/run', {method:'POST', headers: H});
    const d = await r.json();
    connect(d.session_id);
    setTimeout(() => hydrate(d.session_id), 300);
    log(`demo complete — ${d.fields_asked.length} questions, status ${d.status}`, true);
  } catch(e){ log('demo failed: ' + e.message); }
  el('demo').disabled = false;
  el('demo').textContent = '▶ Demo Mode';
};

el('attach').onclick = async () => {
  const r = await fetch('/sessions/recent', {headers: H});
  const d = await r.json();
  if (!d.sessions.length){ log('no active sessions yet — start a call'); return; }
  connect(d.sessions[0].session_id);
  hydrate(d.sessions[0].session_id);
};

async function mountVoice(){
  const cfg = await (await fetch('/config')).json();
  if (!cfg.elevenlabs_agent_id){
    el('widgethint').textContent = 'Set ELEVENLABS_AGENT_ID to embed the voice widget.';
    return;
  }
  // The agent id is public by design — it is what the browser connects with.
  // The widget positions itself as a floating launcher, so it goes on <body>
  // rather than inside a card where it would overlap the card's own content.
  const w = document.createElement('elevenlabs-convai');
  w.setAttribute('agent-id', cfg.elevenlabs_agent_id);
  document.body.appendChild(w);

  const s = document.createElement('script');
  s.src = 'https://unpkg.com/@elevenlabs/convai-widget-embed';
  s.async = true;
  document.body.appendChild(s);

  el('widget').innerHTML =
    `<div style="display:flex;align-items:center;gap:10px">
       <span style="width:9px;height:9px;border-radius:50%;background:var(--ok);
                    box-shadow:0 0 10px var(--ok);flex:none"></span>
       <span style="font-size:13px">Voice agent connected</span>
     </div>`;
  el('widgethint').textContent =
    'Press "Start a call" at the bottom of the screen and speak in any language. ' +
    'Fields fill in here as you talk.';
  // A live call creates its own session; attach to it so the grid follows along.
  setInterval(async () => {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    try{
      const d = await (await fetch('/sessions/recent', {headers: H})).json();
      if (d.sessions?.length && d.sessions[0].session_id !== sessionId){
        connect(d.sessions[0].session_id);
        hydrate(d.sessions[0].session_id);
      }
    } catch(e){}
  }, 3000);
}

loadSchema().then(() => {
  log('dashboard ready', true);
  if (!SECRET) log('no ?secret= in the URL — live updates will be refused');
  mountVoice();
});
</script>
</body>
</html>
